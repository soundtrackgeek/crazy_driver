<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Crazy Driver</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
      #hud { position: fixed; top: 8px; left: 8px; color: #ff0; font: 14px monospace; text-shadow: 2px 2px #000; pointer-events: none; white-space: pre; }
      #banner { position: fixed; top: 22%; left: 0; right: 0; text-align: center; color: #ff0; font: bold 48px monospace; text-shadow: 4px 4px #c00, 6px 6px #000; pointer-events: none; visibility: hidden; letter-spacing: 4px; }
      .minimap { position: fixed; right: 12px; bottom: 12px; width: 160px; height: 160px; image-rendering: pixelated; pointer-events: none; }
      .panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; padding: 16px 20px; background: rgba(10, 10, 40, 0.92); border: 3px solid #ff0; box-shadow: 6px 6px 0 #000; color: #fff; font: 14px monospace; z-index: 10; }
      .panel h2 { margin: 0 0 12px; color: #ff0; text-shadow: 3px 3px #c00; letter-spacing: 3px; }
      .panel h3 { margin: 14px 0 6px; color: #ff0; font-size: 14px; }
      .panel label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; }
      .panel input[type=range] { flex: 1; max-width: 220px; accent-color: #ff0; }
      .panel select, .panel button { font: inherit; background: #223; color: #fff; border: 2px solid #ff0; padding: 2px 8px; cursor: pointer; }
      .panel .check { justify-content: flex-start; }
      .panel .now { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 6px; background: #000; color: #0f0; }
      .panel .now span { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .panel ul { list-style: none; margin: 0; padding: 0; max-height: 160px; overflow: auto; }
      .panel li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed #445; }
      .panel li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .panel li.empty { color: #99a; }
      .panel .add { justify-content: center; margin-top: 10px; padding: 6px; border: 2px dashed #ff0; color: #ff0; cursor: pointer; }
      .panel .hint { color: #99a; text-align: center; margin: 10px 0 0; }
      .audio-button { position: fixed; left: 12px; bottom: 12px; width: 40px; height: 40px; font: bold 20px monospace; background: rgba(10, 10, 40, 0.8); color: #ff0; border: 2px solid #ff0; cursor: pointer; z-index: 5; }
      .timer { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); color: #ff0; font: bold 56px monospace; text-shadow: 4px 4px #c00, 6px 6px #000; pointer-events: none; }
      .timer.low { color: #f33; text-shadow: 4px 4px #600, 6px 6px #000; }
      .position { position: fixed; top: 40px; right: 16px; color: #ff0; font: bold 44px monospace; text-shadow: 4px 4px #c00, 6px 6px #000; pointer-events: none; }
      .position small { font-size: 22px; }
      [hidden] { display: none !important; }
      .menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 20, 0.35); z-index: 8; }
      .menu-box { min-width: min(420px, calc(100vw - 32px)); max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; padding: 18px 24px; background: rgba(10, 10, 40, 0.88); border: 3px solid #ff0; box-shadow: 8px 8px 0 #000; color: #fff; font: 16px monospace; text-align: center; }
      .menu h1 { margin: 0 0 6px; font-size: 40px; color: #ff0; text-shadow: 4px 4px #c00, 6px 6px #000; letter-spacing: 4px; }
      .menu .sub { margin: 0 0 12px; color: #9cf; }
      .menu .rec { color: #0f0; margin: 6px 0; }
      .menu .foot { margin: 14px 0 0; color: #99a; font-size: 13px; }
      .menu ul { list-style: none; margin: 12px 0 0; padding: 0; }
      .menu li { display: flex; justify-content: center; gap: 18px; padding: 6px 12px; margin: 4px 0; cursor: pointer; letter-spacing: 2px; border: 2px solid transparent; }
      .menu li .val { color: #0f0; }
      .menu li .val b { color: #ff0; padding: 0 6px; }
      .menu li.sel { border-color: #ff0; background: #c00; color: #ff0; }
      .menu li.off { opacity: 0.4; cursor: default; }
      .car-card { margin: 4px auto 0; max-width: 380px; color: #ccd; font-size: 13px; }
      .car-card p { margin: 0 0 4px; }
      .car-card table { margin: 0 auto; }
      .car-card td { padding: 0 6px; text-align: left; color: #0f0; }
      .car-card td:nth-child(odd) { color: #ff0; }
      .car-card .dim { color: #334; }
      .results { margin: 8px auto; border-collapse: collapse; font-size: 14px; }
      .results th { color: #ff0; padding: 2px 10px; }
      .results td { padding: 2px 10px; text-align: left; }
      .results tr.me td { color: #0f0; }
      .results i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 1px solid #000; }
      @media (max-width: 600px) { .menu h1 { font-size: 26px; } .timer { font-size: 36px; } .position { font-size: 28px; } }
      @media (max-width: 600px) { #banner { font-size: 28px; } .minimap { width: 100px; height: 100px; } }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="banner"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
